name: docs

# Build on every push and pull request, so a broken docs build shows up there.
# Deploy to GitHub Pages only from master.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r docs/sphx/requirements.txt
      - name: Build
        run: python -m sphinx -b html docs/sphx docs/sphx/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphx/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'FABLE-3DXRD/ImageD11'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
